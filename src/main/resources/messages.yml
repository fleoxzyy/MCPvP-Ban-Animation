# ╔══════════════════════════════════════════════════════════════════╗
# ║                 MCPvPBanAnimation · messages.yml                 ║
# ╚══════════════════════════════════════════════════════════════════╝
#  MiniMessage, legacy &c / &#RRGGBB codes also work.
#  Ban placeholders: {username} {reason} {staff} {duration}

# Do not change. Used to upgrade this file automatically.
config-version: 3

prefix: "<dark_gray>[<dark_red>MCPvP<red>Ban<dark_gray>]</dark_gray> "

# Used in the label when the ban plugin doesn't say. This plugin never sends a ban message
# to chat: your ban plugin already announces bans.
default-reason: "Banned by an operator."
unknown-staff: "Staff"
permanent: "permanent"

# ── Commands ────────────────────────────────────────────────────────────
no-permission: "{prefix}<red>You don't have permission to do that."
player-not-found: "{prefix}<red>Player <white>{player}</white> is not online."
already-animating: "{prefix}<red>An animation for {username} is already playing."
test-started: "{prefix}<green>Playing the ban animation for <white>{username}</white> (test, nobody is banned)."
reloaded: "{prefix}<green>Configuration reloaded."
reload-failed: "{prefix}<red>Reload failed: <white>{error}</white>. The previous config is still active."

usage:
  main: "{prefix}<gray>Usage: <white>/{label} <test|reload|info>"
  test: "{prefix}<gray>Usage: <white>/{label} test [player]"

info:
  header: "{prefix}<gray>Plugin information"
  line: "<dark_gray> » <gray>{key}: <white>{value}"
