name: MCPvPBanAnimation
version: '${version}'
main: com.fleoxxzy.mcpvpBanAnimation.MCPvPBanAnimation
api-version: '1.21'
folia-supported: true
authors: [ fleoraticlyyy ]
description: MCPvP-style ban animation for any ban plugin - the ban goes through instantly, then a replica of the player is smashed by a falling mace and bones fly everywhere.
softdepend: [ LiteBans, AdvancedBan, LibertyBans, Essentials ]

commands:
  mcpvpban:
    description: MCPvPBanAnimation main command.
    usage: /<command> <test|reload|info>
    aliases: [ mcpvpbananimation, banimation ]

permissions:
  mcpvpban.*:
    description: Grants every MCPvPBanAnimation permission except bypass.
    default: op
    children:
      mcpvpban.test: true
      mcpvpban.admin: true
  mcpvpban.test:
    description: Play the animation at a player's position without banning or touching them.
    default: op
  mcpvpban.admin:
    description: Reload the config and view platform info.
    default: op
  mcpvpban.bypass:
    description: This player is never animated; their bans still go through normally.
    default: false
